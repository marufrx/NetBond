name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Restructure App Folder
      run: |
        if [ -d "app/app" ]; then
          mkdir temp_app
          cp -r app/app/* temp_app/
          rm -rf app
          mv temp_app app
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Settings Gradle
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "NetBond"
        include ':app'
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NetBond-APK
        path: app/build/outputs/apk/debug/app-debug.apk

        - name: Clean and Fix Directory Structure
      run: |
        if [ -d "app/app" ]; then
          echo "Moving files from app/app to app..."
          mkdir temp_app
          cp -r app/app/* temp_app/
          rm -rf app
          mv temp_app app
        fi
